<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop the collection — Qpears</title>
  <meta name="description" content="Eight small Qpears goods, from a seed to a single sock. Add to bag opens checkout on Square.">
  <link rel="canonical" href="https://qpears.com/shop.html">
  <link rel="icon" href="assets/favicon.png" type="image/png" sizes="192x192">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="shop" data-announce="The collection is complete. The objects are not.">
  <div data-layout="header"></div>

  <main class="wrap">
    <section class="page-hero">
      <p class="eyebrow">Catalog 001</p>
      <h1>All objects</h1>
      <p class="prose">Eight small goods, photographed as if they were expensive and described as if they were not. Add to bag opens <a href="https://qpears.square.site">the live Square shop</a>.</p>
    </section>
    <div class="shop-bar">
      <span>8 objects</span>
      <span>Sorted by how easy they are to lose</span>
    </div>
    <section class="section" style="padding-top:0">
      <div class="grid" data-catalog></div>
    </section>
  </main>

  <div data-layout="footer"></div>
  <script src="js/config.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
